# Configuração do Sellbird (versão em português).
# As chaves (persona, product, icp...) ficam em inglês porque o código lê
# esses nomes; os valores e comentários você pode escrever em português.
# Dica: `sellbird train https://seu-site.com.br` preenche quase tudo isto
# sozinho e grava em sellbird.local.yaml (que tem prioridade sobre este arquivo).

persona:
  name: "Alex"                       # seu primeiro nome: vai no fim de cada e-mail
  company: "Your Company"            # nome da sua empresa (troque; "Your Company" = ainda não configurado)
  role: "Desenvolvimento de Negócios"
  email: "alex@yourcompany.com"      # o e-mail de onde os e-mails saem
  linkedin: "linkedin.com/in/alex-yourcompany"
  tone: "profissional, consultivo, confiante"

product:
  name: "Your Product"               # nome do produto/serviço ("Your Product" = ainda não configurado)
  description: "Descreva o que o seu produto faz e para quem ele é"
  pricing: "A partir de R$ X/mês"
  key_benefits:
    - "Benefício 1"
    - "Benefício 2"
    - "Benefício 3"
  # Quando a resposta do prospect contém a frase da esquerda, o Sellbird usa a
  # abordagem da direita como guia.
  objection_responses:
    "caro": "Entendo, orçamento importa. A maioria dos nossos clientes vê o retorno em 30 dias..."
    "já temos": "Faz sentido. Fiquei curioso: o que você gostaria que a solução atual fizesse melhor?"
    "sem interesse": "Sem problema. Posso perguntar como vocês fazem isso hoje?"
  offer:
    primary: ""                    # Oferta principal (ex.: "Assinatura mensal a partir de R$ 99/mês")
    entry: ""                      # Oferta de entrada sem compromisso (ex.: "14 dias grátis", "Diagnóstico gratuito")
    goal: "book_call"              # Objetivo: book_call (marcar conversa), start_trial (começar teste), get_reply (obter resposta)
    booking_method: "calendar_link" # calendar_link (link da agenda), suggest_times (sugerir horários), ask_preference (perguntar)
    booking_url: ""                # Link da sua agenda (Calendly, Google Agenda...), se usar calendar_link
    meeting_duration: "15 minutos" # Duração da conversa
    meeting_owner: ""              # Quem participa da reunião (nome ou cargo)

icp:
  # Segmentos que você quer prospectar. A busca grátis (OpenStreetMap) entende
  # termos como "clínica odontológica", "escritório de advocacia", "contabilidade",
  # "imobiliária", "academia", "salão de beleza", "oficina mecânica", "restaurante".
  industries:
    - "Clínica odontológica"
    - "Escritório de contabilidade"
  company_size: "2-50 funcionários"
  # Cargos de quem decide. Em empresa pequena, normalmente o dono.
  titles:
    - "Sócio"
    - "Proprietário"
    - "Fundador"
    - "Diretor"
  # Onde procurar: cidades ou estados ("Curitiba, PR", "São Paulo, SP") ou o país.
  geography:
    - "Brasil"
  # Cargos que indicam que a empresa está comprando AGORA (uma empresa que
  # contrata "Gerente de Marketing" está atrás de ferramentas de marketing).
  # Usado para ler a página de vagas. Vazio = usa os cargos acima.
  hiring_signals: []

# Idioma dos e-mails (Sellbird PT-BR).
# - by_country: true escreve conforme o país da empresa: Brasil em português,
#   Portugal em português europeu, o resto do mundo em inglês.
# - default: o idioma quando não dá para saber o país ("pt-BR", "pt-PT" ou "en").
language:
  default: "pt-BR"
  by_country: true

channels:
  email:
    enabled: true
    provider: "gmail"          # gmail (recomendado) | microsoft | smtp | instantly
    max_daily_sends: 50
    require_approval: true      # native (Gmail/Microsoft/SMTP): você aprova na Caixa de saída; Instantly: envio retido
    # link_domains: ["meusite.com.br"]  # seus outros sites além do domínio de envio e
    #                                   # do link da agenda; no piloto automático, um e-mail
    #                                   # com link para outro lugar espera por você
    # phone_numbers: ["+55 41 99999-0000"]  # seus telefones; no piloto automático, um
    #                                   # e-mail com outro número espera por você
    send_to_risky: false        # também envia para domínios "aceita tudo" (desligado = mais seguro)
    # min_write_score: 60       # só escreve para prospects com nota do Scout de pelo
    #                           # menos isto (0-100); 0 ou vazio = todos
    max_bounce_rate: 0.05       # pausa todo envio se os retornos (bounces) passarem disso
    # Domínio de envio novo? Coloque em start_date o dia em que o aquecimento
    # começou: nenhum e-mail frio durante min_days, depois o limite diário sobe
    # a partir de start_sends, daily_increase por dia, até max_daily_sends.
    # Respostas nunca ficam retidas. Só Gmail/Microsoft/SMTP (o Instantly tem
    # aquecimento próprio). Confira quando quiser com `sellbird warmup`.
    # Recomendação de aquecimento: TrulyInbox, https://trulyinbox.com/?via=sellbird
    # Conecte (`sellbird trulyinbox connect`) e o `sellbird warmup` mostra se
    # esta caixa de e-mail está aquecida de verdade.
    warmup:
      start_date: ""            # AAAA-MM-DD; vazio = sem rampa
      min_days: 14
      start_sends: 5
      daily_increase: 3
      dkim_selector: ""         # só se o seu provedor usar um seletor incomum
    # Envia e-mail frio só em horário comercial, no fuso de cada destinatário,
    # calculado pela localização da empresa. Quem o Sellbird não conseguir
    # localizar recebe no fuso de usage.quiet_hours.timezone.
    # Follow-ups entram na janela; respostas nunca ficam retidas.
    # Só Gmail/Microsoft/SMTP. Tire os # para ligar.
    # send_window:
    #   start: "08:00"
    #   end: "18:00"
    #   weekdays_only: true      # segunda a sexta, em todos os países
    #   recipient_timezone: true  # false: um fuso só para todos (quiet_hours.timezone)
    # Um logo embaixo de cada e-mail, frio ou resposta: o e-mail vai em HTML
    # com a imagem embutida. Logo vazio = texto simples, como antes. Se o
    # arquivo não puder ser usado, o e-mail aprovado espera em vez de sair sem ele.
    # Só Gmail/Microsoft/SMTP.
    # Texto simples costuma chegar melhor em e-mail frio: imagens e HTML podem
    # jogar uma caixa nova para o spam. Aqueça primeiro e teste depois de colocar.
    signature:
      logo: ""                  # PNG/JPEG/GIF até 100 KB, ex.: "data/assets/logo.png"
      width: 120                # largura em pixels
      alt: ""                   # texto quando as imagens estão desligadas; vazio = persona.company
      link: ""                  # endereço que o logo abre (opcional)
      direction: "auto"         # rtl para hebraico ou árabe
  linkedin:
    enabled: false             # precisa ligar de propósito; só ter as credenciais não liga
    max_daily_connections: 20
    max_daily_messages: 10

usage:
  max_daily_claude_percent: 80     # quanto do seu plano Claude o Sellbird pode usar por dia
  heartbeat_interval_minutes: 15   # de quanto em quanto tempo ele "acorda"
  quiet_hours:                     # horário de silêncio: não prospecta nem escreve
    start: "22:00"
    end: "07:00"
    timezone: "America/Sao_Paulo"

# Opcional: o Precleared (precleared.dev) confere se cada destinatário novo pode
# receber e-mail de marketing frio pelas regras do país dele (PECR no Reino Unido,
# CAN-SPAM nos EUA, CASL no Canadá, UWG na Alemanha, CPCE na França e os outros
# dos quatorze países que ele cobre). Ele ainda não cobre o Brasil: para empresas
# brasileiras vale a LGPD (veja docs/pt-BR/GUIA.md). Qualquer outra resposta
# segura o e-mail, com o motivo na Caixa de saída. Uma checagem por endereço;
# 10 por dia grátis sem chave. Só para os provedores nativos (gmail, microsoft, smtp).
compliance:
  # Vai embaixo de todo e-mail frio (nunca nas respostas). A lei americana
  # (CAN-SPAM) exige um endereço postal; no Brasil, identificar quem envia é
  # boa prática da LGPD. Use o endereço da empresa (rua, caixa postal ou
  # endereço fiscal). Enquanto estiver vazio, o e-mail frio sai com um aviso.
  postal_address: ""
  # Linha de descadastro dos e-mails em inglês. Qualquer texto serve: o
  # Sellbird lê toda resposta procurando um pedido para parar.
  opt_out_line: "Not interested? Just let me know and I won't email you again."
  # A mesma linha para os e-mails em português.
  opt_out_line_pt: "Não faz sentido pra você? É só me avisar que não envio mais e-mails."
  # Nunca envie para estes, nem frio nem resposta: concorrentes, clientes
  # atuais, quem estiver sob alguma pendência jurídica. Cada item é um e-mail
  # ou um domínio, e o domínio cobre os subdomínios ("acme.example" também
  # bloqueia "mail.acme.example", mas não "notacme.example"). Conferido na
  # hora do envio, então vale até para e-mail já aprovado. Se você treinou o
  # Sellbird, coloque em sellbird.local.yaml: aquele arquivo tem prioridade.
  do_not_contact: []
  #   - "concorrente.com.br"
  #   - "ana@cliente.com.br"
  precleared:
    enabled: false
    sender_country: ""          # onde sua empresa fica: GB, US, CA, DE, FR, AU,
                                # IE, NL, ES, IT, LV, AE, EG ou QA (BR ainda não)
    address_source: "unknown"   # published | bought | scraped | given | unknown
    prospect_country: ""        # opcional, ex.: US se todos os prospects forem de um país
    # O Sellbird também informa ao Precleared o país do destinatário quando a
    # localização da empresa deixa isso certo (veja docs/precleared.md).

# Opcional: suas próprias regras para os e-mails (tamanho, estrutura, o que
# dizer do produto, links, assunto, despedida), num arquivo markdown. Quando
# definidas, substituem o formato padrão (e-mail 1 curto, uma observação e uma
# pergunta, sem venda). O envio continua limitando a 220 palavras e um link.
# skills/email_rules.md fica fora do git.
# writer:
#   email_rules: "skills/email_rules.md"

# Quando alguém aceita sua oferta, entrega a pessoa ao sistema que executa:
# uma ferramenta num servidor MCP. Veja sellbird/handoff.py. Deixe de fora para cuidar você mesmo.
# handoff:
#   mcp_url: https://example.com/mcp
#   token_env: EXAMPLE_MCP_TOKEN          # a variável do .env com o token
#   tool: create_site
